[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-app"
version = "0.1.0"
description = "Desktop OCR App For Linux"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kivy>=2.3.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "yomitoku>=0.12.0",
    "torch>=2.9.1",
    "torchvision",
    "pytorch-triton-rocm; sys_platform == 'linux'",
]

# https://pytorch.org/get-started/locally/
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
pytorch-triton-rocm = { index = "pytorch" }

[project.scripts]
ocr-app = "ocr_app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_app"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["kivy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yomitoku.*"]
ignore_missing_imports = true
